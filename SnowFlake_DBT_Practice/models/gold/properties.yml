models:
  - name: fact
    description: "One row per booking, with the keys to each dimension and the booking measures."
    config:
      meta:
        owner: "Sayan Adhikary"
        certified: true
      contract:
        enforced: true
    columns:
      - name: booking_id
        description: "Unique booking identifier and key to dim_bookings."
        data_type: text
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bookings')
                field: booking_id
      - name: listing_id
        description: "Key to dim_listings."
        data_type: number(38,0)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: listing_id
      - name: host_id
        description: "Key to dim_hosts."
        data_type: number(38,0)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts')
                field: host_id
      - name: total_amount
        description: "Nights booked times booking amount, plus cleaning and service fees, plus 1%."
        data_type: number(38,2)
        data_tests:
          - not_null
      - name: price_per_night
        description: "Listing price per night."
        data_type: number(38,0)
        data_tests:
          - not_null

  - name: obt
    description: "One big table: one row per booking, joined to its listing and host."
    config:
      meta:
        owner: "Sayan Adhikary"
        certified: true
      contract:
        enforced: true
    columns:
      - name: booking_id
        data_type: text
        data_tests:
          - unique
          - not_null
      - name: listing_id
        data_type: number(38,0)
        data_tests:
          - not_null
      - name: booking_date
        data_type: timestamp_ntz
      - name: total_amount
        data_type: number(38,2)
        data_tests:
          - not_null
      - name: booking_status
        data_type: text
      - name: created_at
        data_type: timestamp_ntz
      - name: key_hash
        data_type: number(19,0)
        data_tests:
          - not_null
      - name: host_id
        data_type: number(38,0)
        data_tests:
          - not_null
      - name: property_type
        data_type: text
      - name: room_type
        data_type: text
      - name: city
        data_type: text
      - name: price_per_night
        data_type: number(38,0)
        data_tests:
          - not_null
      - name: listing_created_at
        data_type: timestamp_ntz
      - name: host_name
        data_type: text
      - name: host_quality
        data_type: text
        data_tests:
          - accepted_values:
              arguments:
                values: ['Very Good', 'Good', 'Average']
      - name: host_created_at
        data_type: timestamp_ntz
